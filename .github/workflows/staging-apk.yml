name: Build staging APK

on:
  push:
    branches: [staging]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/staging-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build staging APK
        run: >-
          flutter build apk -t lib/main.dart --debug
          --dart-define=BASE_URL=https://medsuper-api-69168697113.europe-west1.run.app
          --dart-define=ENV=staging

      - uses: actions/upload-artifact@v4
        with:
          name: medsuper-staging-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
